services:
  postgres:
    image: postgres:16-alpine
    container_name: labcrew-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: labcrew
      POSTGRES_PASSWORD: labcrew
      POSTGRES_DB: labcrew
    volumes:
      - labcrew_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labcrew -d labcrew"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: labcrew-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - labcrew_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  labcrew_pg_data:
  labcrew_redis_data:
