services:
  postgres:
    image: postgres:16-alpine
    container_name: labcrew-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: labcrew
      POSTGRES_PASSWORD: labcrew
      POSTGRES_DB: labcrew
    volumes:
      - labcrew_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labcrew -d labcrew"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: labcrew-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - labcrew_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: worker
    container_name: labcrew-migrate
    environment:
      DATABASE_URL: postgresql://labcrew:labcrew@postgres:5432/labcrew?schema=public
    command: sh -c "npx prisma db push && npx tsx prisma/seed.ts"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: web
    container_name: labcrew-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://labcrew:labcrew@postgres:5432/labcrew?schema=public
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-labcrew-dev-secret-change-me}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-LabCrew <ops@labcrew.local>}
      NUDGE_TEST_TO: ${NUDGE_TEST_TO:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    container_name: labcrew-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://labcrew:labcrew@postgres:5432/labcrew?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  labcrew_pg_data:
  labcrew_redis_data:
