# LabCrew — one-command local / self-host stack
# Usage:
#   cp .env.example .env
#   # set a strong AUTH_SECRET before any real deploy
#   docker compose up --build
#
# Host ports: web 3000 · Postgres 5434 · Redis 6380

services:
  postgres:
    image: postgres:16-alpine
    container_name: labcrew-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-labcrew}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labcrew}
      POSTGRES_DB: ${POSTGRES_DB:-labcrew}
    volumes:
      - labcrew_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-labcrew} -d ${POSTGRES_DB:-labcrew}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: labcrew-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - labcrew_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: worker
    container_name: labcrew-migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-labcrew}:${POSTGRES_PASSWORD:-labcrew}@postgres:5432/${POSTGRES_DB:-labcrew}?schema=public
    command: sh -c "npx prisma migrate deploy || npx prisma db push; npx tsx prisma/seed.ts"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: web
    container_name: labcrew-web
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-labcrew}:${POSTGRES_PASSWORD:-labcrew}@postgres:5432/${POSTGRES_DB:-labcrew}?schema=public
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-labcrew-dev-secret-change-me}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-LabCrew <ops@labcrew.local>}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-20b}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  worker:
    build:
      context: .
      target: worker
    container_name: labcrew-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-labcrew}:${POSTGRES_PASSWORD:-labcrew}@postgres:5432/${POSTGRES_DB:-labcrew}?schema=public
      REDIS_URL: redis://redis:6379
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-20b}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  labcrew_pg_data:
  labcrew_redis_data:
