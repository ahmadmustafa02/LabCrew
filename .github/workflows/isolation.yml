name: Isolation

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  isolation:
    name: Lab A/B isolation suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: labcrew
          POSTGRES_PASSWORD: labcrew
          POSTGRES_DB: labcrew
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labcrew -d labcrew"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://labcrew:labcrew@localhost:5432/labcrew?schema=public
      AUTH_SECRET: ci-isolation-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Isolation tests (must pass)
        run: npm run test:isolation
