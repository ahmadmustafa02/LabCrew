name: labcrew_field
description: LabCrew Field — collect, clean, and chart cohort data from the phone.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.1.4
  fl_chart: ^0.70.2
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  intl: ^0.20.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
